<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" fill="none" aria-hidden="true">
  <!--
    Mid-page instrument atmosphere — denser than the hero field, still quiet.
    Hairline grid + plate fragments so long scroll sections never feel empty.
  -->
  <rect width="1600" height="2000" fill="transparent"/>

  <!-- faint vertical meridians -->
  <g stroke="#2A3244" stroke-width="1" opacity="0.45">
    <line x1="200" y1="0" x2="200" y2="2000"/>
    <line x1="800" y1="0" x2="800" y2="2000"/>
    <line x1="1400" y1="0" x2="1400" y2="2000"/>
  </g>

  <!-- horizontal hour-rail ticks -->
  <g stroke="#2A3244" stroke-width="1" opacity="0.4">
    <line x1="0" y1="280" x2="1600" y2="280"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="0" y1="1160" x2="1600" y2="1160"/>
    <line x1="0" y1="1600" x2="1600" y2="1600"/>
  </g>

  <!-- plate fragment, upper right -->
  <g stroke="#2A3244" stroke-width="1.5" stroke-linecap="round" opacity="0.55" transform="translate(1180 180)">
    <path d="M -260 200 A 280 280 0 0 1 200 -80"/>
    <path d="M -180 160 A 200 200 0 0 1 160 -20"/>
    <line x1="-300" y1="220" x2="220" y2="-100"/>
    <circle cx="-20" cy="80" r="3" fill="#2A3244" stroke="none"/>
  </g>

  <!-- plate fragment, mid left -->
  <g stroke="#2A3244" stroke-width="1.4" stroke-linecap="round" opacity="0.4" transform="translate(160 900)">
    <path d="M 40 -120 A 300 300 0 0 0 340 200"/>
    <path d="M 90 -60 A 220 220 0 0 0 300 160"/>
    <line x1="-20" y1="40" x2="360" y2="100"/>
  </g>

  <!-- brass sight nodes -->
  <g fill="#C8963E" opacity="0.35">
    <circle cx="200" cy="280" r="2.5"/>
    <circle cx="800" cy="720" r="2.5"/>
    <circle cx="1400" cy="1160" r="2.5"/>
    <circle cx="800" cy="1600" r="2.5"/>
  </g>

  <!-- soft verdigris accent arc -->
  <path d="M 1200 1500 A 420 420 0 0 1 900 1900" stroke="#4FB3A4" stroke-width="1.2" opacity="0.22" stroke-linecap="round"/>
</svg>
