<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" aria-hidden="true">
  <!--
    Astrolabe plate field — sparse instrument geometry for the landing surface.
    ~8% opacity in --axis (#2A3244). No text. Under a dozen strokes.
  -->
  <rect width="1600" height="900" fill="#080B11"/>
  <g
    stroke="#2A3244"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.55"
    transform="translate(980 120)"
  >
    <!-- concentric plate arcs, open / cropped -->
    <path d="M -420 480 A 520 520 0 0 1 380 -40"/>
    <path d="M -340 400 A 420 420 0 0 1 300 20"/>
    <path d="M -260 320 A 320 320 0 0 1 220 80"/>
    <path d="M -160 240 A 200 200 0 0 1 140 140"/>
    <!-- sight lines through plate centre -->
    <line x1="-480" y1="520" x2="420" y2="-80"/>
    <line x1="-200" y1="-120" x2="80" y2="560"/>
    <!-- alidade tip mark -->
    <circle cx="-40" cy="200" r="3" fill="#2A3244" stroke="none"/>
  </g>
  <!-- faint second plate fragment, lower left, more cropped -->
  <g
    stroke="#2A3244"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.35"
    transform="translate(120 640)"
  >
    <path d="M 40 -80 A 280 280 0 0 0 320 200"/>
    <path d="M 80 -40 A 200 200 0 0 0 280 160"/>
    <line x1="-40" y1="40" x2="360" y2="120"/>
  </g>
</svg>
