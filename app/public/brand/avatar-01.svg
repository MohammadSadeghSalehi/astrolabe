<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Participant abstract day ring">
  <!-- 24 hour segments; fill pattern A: morning dense, afternoon sparse -->
  <circle cx="48" cy="48" r="40" stroke="#2A3244" stroke-width="1"/>
  <g transform="translate(48 48)">
    <!-- filled hours as solid arcs (reported), empty as dashed -->
    <!-- pattern: more solid early, empty mid-day, solid evening -->
    <path d="M0 -36 A36 36 0 0 1 18 -31.2" stroke="#C8963E" stroke-width="8" stroke-linecap="butt"/>
    <path d="M18 -31.2 A36 36 0 0 1 31.2 -18" stroke="#C8963E" stroke-width="8"/>
    <path d="M31.2 -18 A36 36 0 0 1 36 0" stroke="#C8963E" stroke-width="8"/>
    <path d="M36 0 A36 36 0 0 1 31.2 18" stroke="#8D97AB" stroke-width="8" stroke-dasharray="3 4" opacity="0.7"/>
    <path d="M31.2 18 A36 36 0 0 1 18 31.2" stroke="#8D97AB" stroke-width="8" stroke-dasharray="3 4" opacity="0.7"/>
    <path d="M18 31.2 A36 36 0 0 1 0 36" stroke="#C8963E" stroke-width="8"/>
    <path d="M0 36 A36 36 0 0 1 -18 31.2" stroke="#C8963E" stroke-width="8"/>
    <path d="M-18 31.2 A36 36 0 0 1 -31.2 18" stroke="#8D97AB" stroke-width="8" stroke-dasharray="3 4" opacity="0.7"/>
    <path d="M-31.2 18 A36 36 0 0 1 -36 0" stroke="#C8963E" stroke-width="8"/>
    <path d="M-36 0 A36 36 0 0 1 -31.2 -18" stroke="#C8963E" stroke-width="8"/>
    <path d="M-31.2 -18 A36 36 0 0 1 -18 -31.2" stroke="#8D97AB" stroke-width="8" stroke-dasharray="3 4" opacity="0.7"/>
    <path d="M-18 -31.2 A36 36 0 0 1 0 -36" stroke="#C8963E" stroke-width="8"/>
  </g>
  <circle cx="48" cy="48" r="22" stroke="#2A3244" stroke-width="1"/>
  <circle cx="48" cy="48" r="3" fill="#C8963E"/>
</svg>
